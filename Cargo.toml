[package]
name = "macshot"
version = "0.4.0"
edition = "2024"
build = "build.rs"
description = "Screenshot evidence capture and comparison tool"

[dependencies]
eframe = { version = "0.33", features = ["default_fonts"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
global-hotkey = "0.8"
tray-icon = "0.26.1"
gif = "0.14"
ab_glyph = "0.2"
imageproc = { version = "0.27", default-features = false, features = ["text"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
xcap = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.3"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSString"] }
screencapturekit = { version = "11.1.0", features = ["macos_14_0"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
