[package]
name = "macshot"
version = "0.6.0"
edition = "2024"
build = "build.rs"
description = "Screenshot evidence capture and comparison tool"

[dependencies]
eframe = { version = "0.33", features = ["default_fonts"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
global-hotkey = "0.8"
tray-icon = "0.26.1"
gif = "0.14"
ab_glyph = "0.2"
imageproc = { version = "0.27", default-features = false, features = ["text"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
xcap = "0.9.8"
mp4 = "0.14.0"
openh264 = "0.9.9"
bytes = "1.10.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.3"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSWindow", "NSResponder", "NSScreen"] }
objc2-foundation = { version = "0.2.2", features = ["NSString", "NSBundle", "NSProcessInfo"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["AVAudioApplication", "block2"] }
objc2_06 = { package = "objc2", version = "0.6.5" }
block2 = "0.6.2"
screencapturekit = { version = "11.1.0", features = ["macos_15_0"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5"
pollster = "0.4"
scrcap = "=0.1.0-alpha.2"
zvidlib-aac-encoder = "=0.5.0"
zvidlib-core = "=0.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
